<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="/__TOKEN__/manifest.json">
<title>Home Camera</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #0f1216; color: #e8eaed; font: 16px/1.4 -apple-system, system-ui, sans-serif;
         display: flex; flex-direction: column; align-items: center; padding: 24px 16px; min-height: 100vh; box-sizing: border-box; }
  h1 { font-size: 18px; font-weight: 600; margin: 0 0 20px; letter-spacing: 0.02em; }
  video { width: 100%; max-width: 480px; background: #000; border-radius: 8px; aspect-ratio: 4/3; }
  .status { margin: 16px 0; font-size: 14px; color: #9aa0a6; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  .dot.on { background: #34d058; }
  .dot.off { background: #5f6368; }
  .row { display: flex; gap: 10px; margin-top: 12px; }
  button { font-size: 17px; font-weight: 600; padding: 14px 28px; border-radius: 999px; border: none; min-width: 160px; }
  button.secondary { background: #2a2f36; color: #e8eaed; font-size: 15px; padding: 14px 20px; min-width: auto; }
  button.start { background: #34d058; color: #0f1216; }
  button.stop { background: #f85149; color: #0f1216; }
  button:disabled { opacity: 0.5; }
  .hint { margin-top: 20px; font-size: 12px; color: #5f6368; text-align: center; max-width: 320px; }
  .sessions { margin-top: 28px; width: 100%; max-width: 480px; }
  .sessions h2 { font-size: 13px; font-weight: 600; color: #9aa0a6; text-transform: uppercase; letter-spacing: 0.04em; margin: 0 0 8px; }
  .sessions ul { list-style: none; padding: 0; margin: 0; font-size: 13px; color: #9aa0a6; }
  .sessions li { padding: 6px 0; border-top: 1px solid #21262d; display: flex; justify-content: space-between; }
  .snap-preview { margin-top: 16px; max-width: 320px; border-radius: 8px; display: none; }
</style>
</head>
<body>
  <h1>Home Camera</h1>
  <video id="v" playsinline muted controls></video>
  <div class="status"><span id="dot" class="dot off"></span><span id="statusText">checking...</span></div>
  <div class="row">
    <button id="toggle" disabled>...</button>
    <button id="snap" class="secondary">Snapshot</button>
  </div>
  <img id="snapPreview" class="snap-preview">
  <p class="hint">No auto-stop. Turn it off yourself when you're done -- you'll get a reminder ping if it's left on.</p>

  <div class="sessions">
    <h2>Recent sessions</h2>
    <ul id="sessionList"><li>loading...</li></ul>
  </div>

<script src="/__TOKEN__/hls.js"></script>
<script>
const TOKEN = "__TOKEN__";
const video = document.getElementById("v");
const dot = document.getElementById("dot");
const statusText = document.getElementById("statusText");
const toggle = document.getElementById("toggle");
const snapBtn = document.getElementById("snap");
const snapPreview = document.getElementById("snapPreview");
const sessionList = document.getElementById("sessionList");
// Same-origin proxy (camera_app.py forwards to mediamtx server-side) -- avoids a cross-origin
// XHR to mediamtx's own port, which breaks its cookie-based session auth in every real browser.
// master.m3u8 lists both hi/lo renditions so hls.js/native HLS auto-switch on a bad connection.
const streamUrl = `/${TOKEN}/stream/master.m3u8`;
let hls = null;
let isOn = false;

function attachStream() {
  if (hls) { hls.destroy(); hls = null; }
  if (video.canPlayType("application/vnd.apple.mpegurl")) {
    video.src = streamUrl;
    video.play().catch(() => {});
  } else if (window.Hls && Hls.isSupported()) {
    hls = new Hls({ liveSyncDurationCount: 2 });
    hls.loadSource(streamUrl);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(() => {}));
  }
}

function detachStream() {
  if (hls) { hls.destroy(); hls = null; }
  video.removeAttribute("src");
  video.load();
}

function fmtTime(iso) {
  if (!iso) return "--";
  const d = new Date(iso);
  return d.toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
}

function fmtDuration(startIso, endIso) {
  if (!endIso) return "still on";
  const s = Math.max(0, Math.round((new Date(endIso) - new Date(startIso)) / 1000));
  return s < 60 ? `${s}s` : `${Math.floor(s / 60)}m ${s % 60}s`;
}

async function refreshSessions() {
  try {
    const r = await fetch(`/${TOKEN}/api/sessions`);
    const list = await r.json();
    sessionList.innerHTML = list.length
      ? list.map(s => `<li><span>${fmtTime(s.start)}</span><span>${fmtDuration(s.start, s.end)}</span></li>`).join("")
      : "<li>no sessions yet</li>";
  } catch (e) {
    sessionList.innerHTML = "<li>unreachable</li>";
  }
}

async function refreshStatus() {
  try {
    const r = await fetch(`/${TOKEN}/api/status`);
    const j = await r.json();
    isOn = j.on;
    dot.className = "dot " + (isOn ? "on" : "off");
    statusText.textContent = isOn ? "Live" : "Off";
    toggle.textContent = isOn ? "Turn off" : "Turn on";
    toggle.className = isOn ? "stop" : "start";
    toggle.disabled = false;
    if (isOn && !hls && !video.src) setTimeout(attachStream, 1500);  // give ffmpeg a moment to start publishing
    if (!isOn) detachStream();
  } catch (e) {
    statusText.textContent = "unreachable";
  }
}

toggle.addEventListener("click", async () => {
  toggle.disabled = true;
  toggle.textContent = "...";
  await fetch(`/${TOKEN}/api/${isOn ? "stop" : "start"}`, { method: "POST" });
  setTimeout(() => { refreshStatus(); refreshSessions(); }, 800);
});

snapBtn.addEventListener("click", async () => {
  snapBtn.disabled = true;
  snapBtn.textContent = "...";
  try {
    const r = await fetch(`/${TOKEN}/api/snapshot.jpg?t=${Date.now()}`);
    if (r.ok) {
      snapPreview.src = URL.createObjectURL(await r.blob());
      snapPreview.style.display = "block";
    }
  } finally {
    snapBtn.disabled = false;
    snapBtn.textContent = "Snapshot";
  }
});

// One-tap quick action for a home-screen Shortcut/bookmark: /TOKEN/?go=on or ?go=off skips the
// button tap and returns to a clean URL, so a Siri Shortcut ("Open URL") can toggle in one step.
(async function quickAction() {
  const params = new URLSearchParams(location.search);
  const go = params.get("go");
  if (go === "on" || go === "off") {
    await fetch(`/${TOKEN}/api/${go === "on" ? "start" : "stop"}`, { method: "POST" });
    history.replaceState({}, "", location.pathname);
  }
})();

refreshStatus();
refreshSessions();
setInterval(refreshStatus, 5000);
setInterval(refreshSessions, 15000);
</script>
</body>
</html>
