services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: marketintel
      POSTGRES_USER: postgres
    command: >
      postgres -c shared_buffers=512MB -c effective_cache_size=2GB -c work_mem=16MB
      -c maintenance_work_mem=128MB -c max_connections=60 -c synchronous_commit=off
      -c checkpoint_timeout=15min -c max_wal_size=2GB -c random_page_cost=1.1
    volumes:
      - ./pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    shm_size: 256mb
    ports:
      - "127.0.0.1:5433:5432"
  rest:
    image: postgrest/postgrest:v12.2.3
    restart: unless-stopped
    depends_on: [db]
    env_file: .env
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/marketintel
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_MAX_ROWS: "1000"
  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [rest]
    ports:
      - "127.0.0.1:8100:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
