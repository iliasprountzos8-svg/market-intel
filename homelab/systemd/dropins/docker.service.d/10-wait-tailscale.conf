[Unit]
# Containers publish ports on the Tailscale address; if docker starts before tailscale0 has it, they fail to bind and stay down.
After=tailscaled.service network-online.target
Wants=tailscaled.service

[Service]
ExecStartPre=/bin/sh -c "for i in $(seq 1 90); do ip -4 addr show tailscale0 2>/dev/null | grep -q 100.83.128.73 && exit 0; sleep 1; done; exit 0"
